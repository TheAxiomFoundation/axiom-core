[workspace]
members = ["crates/axiom-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
axiom-rules-engine = { git = "https://github.com/TheAxiomFoundation/axiom-rules-engine", rev = "d142c645917817cf590e036fb99f99b2d4780e1a", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_ignored = "0.1.14"
sha2 = "0.10.9"
